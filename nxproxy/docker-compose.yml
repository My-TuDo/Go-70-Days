services:           # 定义服务
  api:              # 定义一个名为 api 的服务
    build: .        # 使用当前目录下的 Dockerfile 构建镜像
    ports:          # 映射端口
      - "50051:50051"

  nginx:            # 定义一个名为 nginx 的服务
    image: nginx:alpine # 使用官方的 nginx:alpine 镜像
    ports:          # 映射端口
      - "8080:8080"
    volumes:        # 挂载卷
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # 将当前目录下的 nginx/default.conf 文件挂载到容器内的 /etc/nginx/conf.d/default.conf
      - ./static:/usr/share/nginx/html  # 将当前目录下的 static 目录挂载到容器内的 /usr/share/nginx/html
    depends_on:     # 定义服务依赖关系：先启动 api 服务， 再启动 nginx 服务
      - api
